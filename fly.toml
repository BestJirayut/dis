# fly.toml — ตั้งค่า deploy บน Fly.io
# เปลี่ยน app = "..." ให้ตรงกับชื่อแอปของคุณ (เช่น best-u5yz4a)

app = "dis-0-kx1w"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
